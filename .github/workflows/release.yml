# Builds, signs and publishes a release for Windows and macOS.
#
# Triggered by pushing a version tag:
#
#     npm version 1.1.1 --no-git-tag-version   (bumps package.json)
#     # bump src-tauri/Cargo.toml and src-tauri/tauri.conf.json to match
#     git commit -am "1.1.1" && git tag v1.1.1 && git push --follow-tags
#
# tauri-action does the bundling and also writes `latest.json`, which is the
# file the installed app polls. The three must agree - the version in the tag,
# in tauri.conf.json and in latest.json - or the app will either not see the
# update or refuse it.
name: release

on:
  push:
    tags: ['v*']
  # Lets a failed release be re-run without moving the tag around.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      # One platform failing must not cancel a build that has already started
      # for the other; a half-finished release is easier to finish than to redo.
      fail-fast: false
      # Both jobs publish into the same release, and both rewrite `latest.json`
      # by merging their platform into whatever is already attached to it. Run
      # them at the same time and the second upload overwrites the first one's
      # entry, leaving a release that only one platform can update from. One at
      # a time costs a few minutes and removes the race entirely.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # A universal binary is one artifact that runs on both Apple Silicon
          # and Intel, so there is a single macOS build to sign and upload.
          # tauri-action still writes `darwin-aarch64` and `darwin-x86_64`
          # entries for it, both pointing at that one file, so the updater
          # matches on the first key it asks for.
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Building universal means compiling for both architectures, so both
          # targets have to be installed even though the runner is only one.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Rust builds are slow and almost entirely cacheable.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Without this the two platforms would fight over one cache entry.
          key: ${{ matrix.platform }}

      - run: npm ci

      # A release that fails its own tests is not a release. This is the same
      # command used locally, so there is one definition of "passing".
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Notes_MJ __VERSION__'
          releaseBody: |
            **Windows** — stáhněte `Notes_MJ___VERSION___x64-setup.exe` a spusťte.

            **macOS** — stáhněte `Notes_MJ___VERSION___universal.dmg`, otevřete
            a přetáhněte aplikaci do Aplikací. Balíček není notarizovaný, takže
            při prvním spuštění je potřeba kliknout pravým tlačítkem → Otevřít.

            Kdo už Notes_MJ nainstalované má, nemusí dělat nic — aplikace si
            novou verzi najde sama a nabídne restart.
          releaseDraft: false
          prerelease: false
          # This is what makes automatic updates work: it publishes latest.json
          # alongside the installer, with the signature the app checks.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
